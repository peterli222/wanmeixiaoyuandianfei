<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>宿舍电量看板</title>
<style>
  :root{
    --bg:#0d1117; --panel:#161b22; --panel2:#1c2430; --line:#30363d;
    --fg:#e6edf3; --dim:#8b949e; --accent:#58a6ff; --ok:#3fb950;
    --warn:#d29922; --bad:#f85149; --bar:#1f6feb;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    background:var(--bg); color:var(--fg); min-height:100vh; padding:24px 20px 60px;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
  }
  .wrap{max-width:1180px;margin:0 auto}
  header{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap;margin-bottom:22px}
  h1{font-size:20px;font-weight:600;letter-spacing:.5px}
  .sub{color:var(--dim);font-size:13px}
  .dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--ok);margin-right:6px;
       animation:pulse 2s ease-in-out infinite}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}

  .hero{
    background:linear-gradient(135deg,#161b22 0%,#1a2230 100%);
    border:1px solid var(--line); border-radius:14px; padding:26px 28px;
    display:flex; align-items:center; gap:36px; flex-wrap:wrap; margin-bottom:18px;
  }
  .big{font-size:64px;font-weight:700;line-height:1;letter-spacing:-2px;
       font-variant-numeric:tabular-nums}
  .unit{font-size:20px;color:var(--dim);margin-left:6px;font-weight:400}
  .badge{padding:5px 13px;border-radius:20px;font-size:13px;font-weight:600;
         display:inline-block;margin-top:10px}
  .b-ok{background:rgba(63,185,80,.15);color:var(--ok)}
  .b-warn{background:rgba(210,153,34,.15);color:var(--warn)}
  .b-bad{background:rgba(248,81,73,.15);color:var(--bad)}
  .hero-meta{color:var(--dim);font-size:13px;line-height:1.9;margin-left:auto;text-align:right}

  .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:14px;margin-bottom:18px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:18px 20px}
  .card .k{color:var(--dim);font-size:12px;letter-spacing:.6px;margin-bottom:8px}
  .card .v{font-size:26px;font-weight:600;font-variant-numeric:tabular-nums}
  .card .v small{font-size:13px;color:var(--dim);font-weight:400;margin-left:3px}

  .panel{background:var(--panel);border:1px solid var(--line);border-radius:12px;
         padding:20px 22px 14px;margin-bottom:18px}
  .panel h2{font-size:14px;font-weight:600;color:var(--fg);margin-bottom:4px}
  .panel .hint{font-size:12px;color:var(--dim);margin-bottom:16px}
  svg{display:block;width:100%;overflow:visible}
  .empty{color:var(--dim);font-size:13px;padding:26px 0;text-align:center}
  .ax{fill:var(--dim);font-size:11px}
  .gline{stroke:var(--line);stroke-width:1;stroke-dasharray:3 4;opacity:.6}

  .toolbar{display:flex;align-items:center;gap:12px;margin-bottom:16px;flex-wrap:wrap}
  .qbtn{background:var(--bar);color:#fff;border:none;border-radius:9px;
        padding:10px 20px;font-size:14px;font-weight:600;cursor:pointer;
        display:inline-flex;align-items:center;gap:7px;
        font-family:inherit;transition:filter .15s,transform .08s}
  .qbtn:hover:not(:disabled){filter:brightness(1.15)}
  .qbtn:active:not(:disabled){transform:translateY(1px)}
  .qbtn:disabled{opacity:.55;cursor:progress}
  .qbtn .qi{display:inline-block;font-size:15px;line-height:1}
  .qbtn.busy .qi{animation:spin 1s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  .qmsg{font-size:13px;color:var(--dim)}
  .qmsg.ok{color:var(--ok)}
  .qmsg.err{color:var(--bad)}

  table{width:100%;border-collapse:collapse;font-size:13px}
  th{color:var(--dim);font-weight:500;text-align:left;padding:8px 10px;
     border-bottom:1px solid var(--line);font-size:12px;letter-spacing:.4px}
  td{padding:9px 10px;border-bottom:1px solid rgba(48,54,61,.45);font-variant-numeric:tabular-nums}
  tr:last-child td{border-bottom:none}
  tr:hover td{background:rgba(88,166,255,.05)}
  .num{text-align:right}
  footer{color:var(--dim);font-size:12px;text-align:center;margin-top:30px;line-height:1.9}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>宿舍电量看板</h1>
    <span class="sub" id="roomLabel">—</span>
    <span class="sub" style="margin-left:auto"><span class="dot"></span><span id="upd">加载中…</span></span>
  </header>

  <div class="toolbar">
    <button id="qbtn" class="qbtn" type="button">
      <span class="qi">⟳</span> 立即查询
    </button>
    <span id="qmsg" class="qmsg"></span>
  </div>

  <div class="hero">
    <div>
      <div><span class="big" id="cur">--</span><span class="unit">度</span></div>
      <div id="badge" class="badge b-ok">正常</div>
    </div>
    <div class="hero-meta" id="meta"></div>
  </div>

  <div class="grid" id="cards"></div>

  <div class="panel">
    <h2>剩余电量走势</h2>
    <div class="hint">每个采样点一行，折线下降越陡说明用得越快</div>
    <div id="chartLine"></div>
  </div>

  <div class="panel">
    <h2>每日用电量</h2>
    <div class="hint">相邻采样点的差值累加（充值跳升不计入）</div>
    <div id="chartDaily"></div>
  </div>

  <div class="panel">
    <h2>用电时段分布</h2>
    <div class="hint">一天 24 小时各时段累计用量，看你们几点最费电</div>
    <div id="chartHour"></div>
  </div>

  <div class="panel">
    <h2>最近采样记录</h2>
    <div class="hint">最新 20 条</div>
    <div id="tbl"></div>
  </div>

  <footer>
    数据每小时自动采集一次 · 免登录云支付网关读取<br>
    页面每 30 分钟自动刷新（每小时两次） · <span id="gen">—</span>
  </footer>
</div>

<script id="embedded" type="application/json">null</script>
<script>
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

function fmtTime(ts){
  const d = new Date(ts*1000), p = n => String(n).padStart(2,'0');
  return `${p(d.getMonth()+1)}-${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}`;
}
function fmtAgo(sec){
  if(sec==null) return '无数据';
  if(sec<90) return '刚刚';
  if(sec<3600) return Math.round(sec/60)+' 分钟前';
  if(sec<86400) return Math.round(sec/3600)+' 小时前';
  return Math.round(sec/86400)+' 天前';
}

/* ---------- 折线图 ---------- */
function lineChart(samples){
  if(samples.length < 2) return '<div class="empty">样本不足，等几次采样后这里就会出现走势</div>';
  const W=1100, H=280, L=58, R=18, T=16, B=34;
  const iw=W-L-R, ih=H-T-B;
  const xs = samples.map(s=>s.ts), ys = samples.map(s=>s.kwh);
  const x0=Math.min(...xs), x1=Math.max(...xs);
  let y0=Math.min(...ys), y1=Math.max(...ys);
  const pad = Math.max(0.5,(y1-y0)*0.15); y0-=pad; y1+=pad;
  if(y1-y0 < 1){ y0-=0.5; y1+=0.5; }
  const X = t => L + (x1===x0 ? iw/2 : (t-x0)/(x1-x0)*iw);
  const Y = v => T + ih - (v-y0)/(y1-y0)*ih;

  let g='', yt=5;
  for(let i=0;i<=yt;i++){
    const v = y0 + (y1-y0)*i/yt, y = Y(v);
    g += `<line class="gline" x1="${L}" y1="${y}" x2="${W-R}" y2="${y}"/>
          <text class="ax" x="${L-10}" y="${y+4}" text-anchor="end">${v.toFixed(1)}</text>`;
  }
  const pts = samples.map(s=>`${X(s.ts).toFixed(1)},${Y(s.kwh).toFixed(1)}`).join(' ');
  const area = `${L},${T+ih} ${pts} ${W-R},${T+ih}`;

  // x 轴：按真实时间取整刻度（不是按样本序号），标签宽度自适应防重叠
  const sameDay = new Date(x0*1000).toDateString() === new Date(x1*1000).toDateString();
  const p2 = n => String(n).padStart(2,'0');
  const hhmm = t => { const d = new Date(t*1000); return p2(d.getHours())+':'+p2(d.getMinutes()); };
  const mmdd = t => { const d = new Date(t*1000); return p2(d.getMonth()+1)+'-'+p2(d.getDate()); };
  const widest = sameDay ? 5 : 11;                       // 最宽标签字符数
  const maxTicks = Math.max(2, Math.min(9, Math.floor(iw / (widest*7.4 + 34))));
  const STEPS = [60,120,300,600,900,1800,3600,7200,10800,21600,43200,86400,172800,
                 604800,1209600,2592000,7776000,15552000,31536000];
  let step = STEPS[STEPS.length-1];
  for(const s of STEPS){ if((x1-x0)/s <= maxTicks){ step = s; break; } }
  const tzOff = new Date(x0*1000).getTimezoneOffset()*60;   // 对齐本地整点
  const firstTick = Math.ceil((x0 - tzOff)/step)*step + tzOff;
  const EDGE = 72;                                          // 两端留给首尾标签
  let xt='';
  for(let t=firstTick; t<=x1; t+=step){
    const x = X(t);
    if(x < L+EDGE || x > W-R-EDGE) continue;
    const lb = sameDay ? hhmm(t) : (step >= 86400 ? mmdd(t) : mmdd(t)+' '+hhmm(t));
    xt += `<line class="gline" x1="${x.toFixed(1)}" y1="${T}" x2="${x.toFixed(1)}" y2="${T+ih}" opacity=".22"/>
           <text class="ax" x="${x.toFixed(1)}" y="${H-12}" text-anchor="middle">${lb}</text>`;
  }
  xt += `<text class="ax" x="${L}" y="${H-12}" text-anchor="start">${sameDay?hhmm(x0):mmdd(x0)}</text>
         <text class="ax" x="${W-R}" y="${H-12}" text-anchor="end">${sameDay?hhmm(x1):mmdd(x1)}</text>`;
  const last = samples[samples.length-1];
  return `<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="xMidYMid meet">
    <defs><linearGradient id="ag" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#58a6ff" stop-opacity=".35"/>
      <stop offset="100%" stop-color="#58a6ff" stop-opacity="0"/>
    </linearGradient></defs>
    ${g}
    <polygon points="${area}" fill="url(#ag)"/>
    <polyline points="${pts}" fill="none" stroke="#58a6ff" stroke-width="2"
      stroke-linejoin="round" stroke-linecap="round"/>
    <circle cx="${X(last.ts)}" cy="${Y(last.kwh)}" r="4" fill="#58a6ff"/>
    <circle cx="${X(last.ts)}" cy="${Y(last.kwh)}" r="8" fill="#58a6ff" opacity=".2"/>
    ${xt}
  </svg>`;
}

/* ---------- 每日柱状 ---------- */
function barChart(daily, key, label, color){
  if(!daily.length) return '<div class="empty">还没有按天的数据</div>';
  const rows = daily.slice(-30);
  const W=1100, H=240, L=52, R=18, T=16, B=40;
  const iw=W-L-R, ih=H-T-B;
  const max = Math.max(0.1, ...rows.map(d=>d[key]));
  const bw = iw / rows.length;
  const w = Math.min(46, bw*0.62);
  // 标签宽度约 5 字符 × 7.4px，间隔太密就跳着标，保证不重叠
  const LB = 5*7.4 + 10;
  const every = Math.max(1, Math.ceil(LB / bw));
  let bars='', xt='';
  rows.forEach((d,i)=>{
    const v = d[key];
    const h = v/max*ih;
    const x = L + bw*i + (bw-w)/2;
    const y = T + ih - h;
    bars += `<rect x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${w.toFixed(1)}" height="${Math.max(1,h).toFixed(1)}"
      rx="3" fill="${color}" opacity="${v>0?.85:.18}"><title>${d.date}: ${v} 度</title></rect>`;
    // 从最后一天往前对齐，保证最新日期一定有标签
    if((rows.length-1-i) % every === 0){
      xt += `<text class="ax" x="${(x+w/2).toFixed(1)}" y="${H-16}" text-anchor="middle">${d.date.slice(5)}</text>`;
    }
  });
  let g='';
  for(let i=0;i<=4;i++){
    const v = max*i/4, y = T+ih-ih*i/4;
    g += `<line class="gline" x1="${L}" y1="${y}" x2="${W-R}" y2="${y}"/>
          <text class="ax" x="${L-10}" y="${y+4}" text-anchor="end">${v.toFixed(1)}</text>`;
  }
  return `<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="xMidYMid meet">${g}${bars}${xt}</svg>`;
}

/* ---------- 小时分布 ---------- */
function hourChart(hourly){
  const W=1100, H=220, L=52, R=18, T=16, B=36;
  const iw=W-L-R, ih=H-T-B;
  const max = Math.max(0.05, ...hourly);
  const bw = iw/24, w = Math.min(34, bw*0.66);
  let bars='', xt='';
  hourly.forEach((v,h)=>{
    const bh = v/max*ih, x = L+bw*h+(bw-w)/2, y = T+ih-bh;
    bars += `<rect x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${w.toFixed(1)}" height="${Math.max(1,bh).toFixed(1)}"
      rx="3" fill="#3fb950" opacity="${v>0?.8:.15}"><title>${h}:00 — ${v} 度</title></rect>`;
    if(h%3===0) xt += `<text class="ax" x="${(x+w/2).toFixed(1)}" y="${H-14}" text-anchor="middle">${h}时</text>`;
  });
  let g='';
  for(let i=0;i<=3;i++){
    const v=max*i/3, y=T+ih-ih*i/3;
    g += `<line class="gline" x1="${L}" y1="${y}" x2="${W-R}" y2="${y}"/>
          <text class="ax" x="${L-10}" y="${y+4}" text-anchor="end">${v.toFixed(2)}</text>`;
  }
  return `<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="xMidYMid meet">${g}${bars}${xt}</svg>`;
}

/* ---------- 渲染 ---------- */
function render(d){
  const s = d.summary;
  $('roomLabel').textContent = s.label || '宿舍';
  $('upd').textContent = '更新于 ' + new Date(d.generated_at*1000).toLocaleTimeString('zh-CN');
  $('gen').textContent = '数据生成 ' + fmtTime(d.generated_at);

  $('cur').textContent = s.current==null ? '--' : s.current.toFixed(1);

  const b = $('badge');
  if(s.current==null){ b.className='badge b-warn'; b.textContent='暂无数据'; }
  else if(s.current <= s.threshold){ b.className='badge b-bad'; b.textContent='电量不足（低于 '+s.threshold+' 度）'; }
  else if(s.current <= s.threshold*3){ b.className='badge b-warn'; b.textContent='偏低，注意充值'; }
  else { b.className='badge b-ok'; b.textContent='电量充足'; }

  $('meta').innerHTML = [
    '最近采样：' + (s.current_ts ? fmtTime(s.current_ts) : '—') + '（' + fmtAgo(s.age_sec) + '）',
    '累计样本：' + s.sample_count + ' 条',
    '监控起始：' + (s.first_ts ? fmtTime(s.first_ts) : '—')
  ].join('<br>');

  const cards = [
    ['今日用电', d.daily.length ? d.daily[d.daily.length-1].used : 0, '度'],
    ['日均用电', s.per_day==null?0:s.per_day, '度/天'],
    ['预计可用', s.days_left==null?'—':s.days_left, s.days_left==null?'':'天'],
    ['累计统计用电', s.used_total, '度'],
  ];
  $('cards').innerHTML = cards.map(([k,v,u])=>
    `<div class="card"><div class="k">${k}</div><div class="v">${v}<small>${u}</small></div></div>`).join('');

  $('chartLine').innerHTML = lineChart(d.samples);
  $('chartDaily').innerHTML = barChart(d.daily, 'used', '用量', '#1f6feb');
  $('chartHour').innerHTML = hourChart(d.hourly);

  const rows = d.samples.slice(-20).reverse();
  $('tbl').innerHTML = rows.length ? `<table>
    <thead><tr><th>时间</th><th class="num">剩余电量(度)</th><th class="num">较上次</th></tr></thead>
    <tbody>${rows.map((r,i)=>{
      const prev = rows[i+1];
      let delta = '—';
      if(prev){ const dv = r.kwh - prev.kwh;
        delta = (dv>0?'+':'') + dv.toFixed(2) + (dv>0?' （充值）':'');
      }
      return `<tr><td>${fmtTime(r.ts)}</td><td class="num">${r.kwh.toFixed(2)}</td><td class="num">${delta}</td></tr>`;
    }).join('')}</tbody></table>` : '<div class="empty">还没有采样记录</div>';
}

function embedded(){
  try{
    const t = document.getElementById('embedded');
    if(!t) return null;
    const v = JSON.parse(t.textContent);
    return (v && v.summary) ? v : null;
  }catch(e){ return null; }
}

async function load(){
  const em = embedded();
  if(em){                       // 离线单文件模式：数据已内嵌，不联网
    render(em);
    $('upd').textContent = '离线快照 · ' + new Date(em.generated_at*1000).toLocaleTimeString('zh-CN');
    return;
  }
  try{
    const r = await fetch('/api/data', {cache:'no-store'});
    const d = await r.json();
    if(d.error) throw new Error(d.error);
    render(d);
  }catch(e){
    $('upd').textContent = '读取失败：' + e.message;
  }
}
const qbtn = $('qbtn'), qmsg = $('qmsg');

function setMsg(text, kind){
  qmsg.textContent = text;
  qmsg.className = 'qmsg' + (kind ? ' ' + kind : '');
}

async function triggerQuery(){
  if(embedded()){
    setMsg('离线快照不能查询，请打开 http://127.0.0.1:8848 用在线版', 'err');
    return;
  }
  qbtn.disabled = true;
  qbtn.classList.add('busy');
  setMsg('正在读取电表…');
  const t0 = Date.now();
  try{
    const r = await fetch('/api/query', {method:'POST', cache:'no-store'});
    const d = await r.json();
    if(!d.ok){
      setMsg(d.error || '查询失败', 'err');
      return;
    }
    if(d.data) render(d.data);          // 查询完直接用新数据重绘，不用等定时刷新
    const secs = ((Date.now()-t0)/1000).toFixed(1);
    setMsg('查询成功 · ' + new Date(d.ts*1000).toLocaleTimeString('zh-CN') +
           ' · 剩余 ' + d.kwh.toFixed(1) + ' 度 · 耗时 ' + secs + ' 秒', 'ok');
  }catch(e){
    setMsg('请求失败：' + e.message, 'err');
  }finally{
    qbtn.disabled = false;
    qbtn.classList.remove('busy');
  }
}

qbtn.addEventListener('click', triggerQuery);

load();
// 每小时采样一次，页面半小时拉一次足够（每小时两次）
if(!embedded()) setInterval(load, 30 * 60 * 1000);
</script>
</body>
</html>
